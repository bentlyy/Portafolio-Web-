# Docker compose unificado para desarrollo local
# Cada proyecto se levanta con su propio docker-compose.yml
# Este archivo solo orquesta el gateway común

services:
  gateway:
    image: nginx:alpine
    container_name: orbital-gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - orbital-net

networks:
  orbital-net:
    driver: bridge
