real_ip_header CF-Connecting-IP;

# ─── Security headers compartidos ────────────────────
# (Se aplican via inline en cada server por compatibilidad)

# ─── HTTP → redirige a HTTPS ────────────────────────
server {
    listen 80;
    server_name amgdeveloper.cl www.amgdeveloper.cl;
    return 301 https://$host$request_uri;
}

# ─── HTTPS ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name amgdeveloper.cl www.amgdeveloper.cl;

    ssl_certificate     /etc/nginx/certs/amgdeveloper.cl.pem;
    ssl_certificate_key /etc/nginx/certs/amgdeveloper.cl.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'" always;

    location / {
        include cloudflare-allow.conf;

        limit_req zone=general burst=20 nodelay;
        proxy_pass http://host.docker.internal:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

